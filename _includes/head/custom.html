{% assign avatar_icon_version = site.time | date: "%s" %}
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/Images/apple-touch-icon.webp' | relative_url }}?v={{ avatar_icon_version }}">
<link rel="icon" type="image/webp" sizes="32x32" href="{{ '/Images/favicon-32x32.webp' | relative_url }}?v={{ avatar_icon_version }}">
<link rel="icon" type="image/webp" sizes="16x16" href="{{ '/Images/favicon-16x16.webp' | relative_url }}?v={{ avatar_icon_version }}">
<link rel="shortcut icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}?v={{ avatar_icon_version }}">
<link rel="manifest" href="{{ '/Images/site.webmanifest' | relative_url }}?v={{ avatar_icon_version }}">

<meta name="msapplication-TileColor" content="#000000">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="assets/css/academicons.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<!-- end custom head snippets -->
